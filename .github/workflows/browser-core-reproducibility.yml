name: Browser core reproducibility
on:
  push:
    branches: ['main', 'feature/global-i18n-2026-11-15']
    paths:
      - '.github/workflows/browser-core-reproducibility.yml'
      - 'src/**'
      - 'tools/**'
      - 'scripts/build-browser-engine.mjs'
      - 'test/browser-core-parity.test.js'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/browser-core-reproducibility.yml'
      - 'src/**'
      - 'tools/**'
      - 'scripts/build-browser-engine.mjs'
      - 'test/browser-core-parity.test.js'

  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install pinned source-bundling libraries
        run: npm install --no-save --package-lock=false --ignore-scripts esbuild@0.25.12 @noble/hashes@1.8.0
      - name: Rebuild original engine for the browser
        run: node scripts/build-browser-engine.mjs
      - name: Verify byte-reproducible committed artifact
        run: git diff --exit-code -- tools/browser-engine.bundle.js
      - name: Verify exact browser/native core parity
        run: node --test test/browser-core-parity.test.js
