name: Browser smoke for multilingual offline viewers
on:
  push:
    branches: ['feature/global-i18n-2026-11-15']
    paths:
      - scripts/browser-mobile-smoke.mjs
      - .github/workflows/browser-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install pinned browser testing tool
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium for headless checks
        run: npx playwright install --with-deps chromium
      - name: Verify two offline apps at desktop and mobile widths
        run: node scripts/browser-mobile-smoke.mjs
