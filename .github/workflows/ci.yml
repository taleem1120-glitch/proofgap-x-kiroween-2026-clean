name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

# Least privilege: the workflow only needs to read the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      # Third-party actions are pinned to full commit SHAs (tags: actions/checkout v7.0.1, actions/setup-node v7.1.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # package-lock.json exists (the project has zero dependencies), so `npm ci` is valid and verifies it.
      - run: npm ci --ignore-scripts
      - run: node --version
      - run: npm test
      - name: Demo smoke test (local files only, no network)
        run: node src/cli.js examples/demo/case.json --evidence-dir examples/demo/evidence --format text > /dev/null
