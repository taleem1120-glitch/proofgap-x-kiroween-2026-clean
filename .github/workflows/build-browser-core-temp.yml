name: Build original core for browser (one-time controlled)
on:
  push:
    branches: ['feature/global-i18n-2026-11-15']
    paths: ['.github/workflows/build-browser-core-temp.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install pinned build dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts esbuild@0.25.12 @noble/hashes@1.8.0
      - name: Build shared core into self-contained browser module
        run: node scripts/build-browser-engine.mjs
      - name: Cross-check engine policy on Node before committing artifact
        run: node --test test/browser-core-parity.test.js
      - name: Save verified artifact in feature branch only
        run: |
          git add tools/browser-engine.bundle.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'build: deterministic identical-policy offline browser core'
          git push origin HEAD:feature/global-i18n-2026-11-15
