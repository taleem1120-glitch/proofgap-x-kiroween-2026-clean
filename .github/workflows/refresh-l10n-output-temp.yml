name: Refresh translated HTML outputs - temp
on:
  push:
    branches: ['feature/global-i18n-2026-11-15']
    paths: ['.github/workflows/refresh-l10n-output-temp.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: |
          rm -f viewer/showcase.html apps/proofgap-cite/showcase.html
          npm run showcase
          npm run showcase:cite
          git add viewer/showcase.html apps/proofgap-cite/showcase.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'build: regenerate localized reporting demo pages'
          git push origin HEAD:feature/global-i18n-2026-11-15
