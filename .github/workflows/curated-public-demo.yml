name: Curated public demo validation
on:
  pull_request:
    branches: [main]
  push:
    branches: ['release/judge-demo-integration-2026-11-27']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: node --test test/public-demo-package.test.js
      - run: node scripts/build-public-demo.mjs "${RUNNER_TEMP}/proofgap-public-demo"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proofgap-curated-public-demo-${{ github.sha }}
          path: ${{ runner.temp }}/proofgap-public-demo/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
