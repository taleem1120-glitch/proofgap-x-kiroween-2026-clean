name: Publish curated competition demo
on:
  workflow_dispatch:
    inputs:
      confirm_public_demo:
        description: 'Owner confirms synthetic-only public demo and Pages source is GitHub Actions'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: proofgap-public-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_demo == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate:local
      - run: node scripts/build-public-demo.mjs "${RUNNER_TEMP}/proofgap-public-demo"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/proofgap-public-demo
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.confirm_public_demo == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the verified allow-listed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: |
          for attempt in {1..12}; do
            if node scripts/verify-curated-live.mjs; then exit 0; fi
            sleep 10
          done
          exit 1
